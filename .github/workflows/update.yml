name: 원자료 갱신 및 배포

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 08:00 KST
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.scrape.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 서울시 원자료 확인
        id: scrape
        continue-on-error: true
        run: |
          python scripts/scrape_projects.py
          echo "result=$(python -c "import json;print(json.load(open('data/meta.json'))['last_result'])")" >> "$GITHUB_OUTPUT"
      - name: 변경분 커밋
        run: |
          git config user.name "youth-housing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data: 청년안심주택 원자료 갱신 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            git push
          fi
      - name: 수집 실패 시 경고
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::서울시 원자료 수집에 실패했습니다. 기존 데이터로 계속 배포합니다. data/meta.json 의 last_error 를 확인하세요."

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
